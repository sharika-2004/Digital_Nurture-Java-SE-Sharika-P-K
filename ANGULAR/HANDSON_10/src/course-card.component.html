<div class="course-card">

    <h3>{{course.name}}</h3>

    <p>
        <strong>Code:</strong>
        {{course.code}}
    </p>

    <p>
        <strong>Credits:</strong>
        {{course.credits}}
    </p>

    <p>

        <strong>Status:</strong>

        <span
        [class.passed]="course.gradeStatus==='passed'"
        [class.progress]="course.gradeStatus==='in-progress'"
        [class.failed]="course.gradeStatus==='failed'">

        {{course.gradeStatus}}

        </span>

    </p>

    <button (click)="onEnroll()">

        Enroll

    </button>

</div>
