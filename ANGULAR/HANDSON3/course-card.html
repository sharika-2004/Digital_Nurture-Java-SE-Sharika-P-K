
<div class="card-wrapper" 
     [ngClass]="cardClasses" 
     [ngStyle]="{ 'border-left-color': course.gradeStatus === 'passed' ? 'green' : course.gradeStatus === 'failed' ? 'red' : 'grey' }"
     [appHighlight]="'#fffde7'"> 

  <h3>{{ course.title }}</h3>
  

  <p>Credits: {{ course.credits | creditLabel }}</p>

  
  <div [ngSwitch]="course.gradeStatus">
    <span *ngSwitchCase="'passed'" class="badge badge--green">Passed</span>
    <span *ngSwitchCase="'failed'" class="badge badge--red">Failed</span>
    <span *ngSwitchCase="'pending'" class="badge badge--grey">Pending</span>
  </div>

  
  <div style="margin-top: 12px;">
    <button (click)="toggleDetails()">
      {{ isExpanded ? 'Hide Details' : 'Show Details' }}
    </button>
  </div>

  <div *ngIf="isExpanded" style="margin-top: 10px; font-size: 13px; color: #555;">
    <p>Course Details: Core engineering project parameters are verified successfully.</p>
  </div>
</div>
