<h1>{{ portalName }}</h1>

<p>
  Manage your courses, monitor your progress and access your profile.
</p>

<div class="stats">

  <div>
    <strong>Courses Available:</strong> 12
  </div>

  <div>
    <strong>Enrolled:</strong> 3
  </div>

  <div>
    <strong>GPA:</strong> 3.8
  </div>

</div>

<br>

<button
    [disabled]="!isPortalActive"
    (click)="onEnrollClick()">

    Enroll Now

</button>

<p>{{ message }}</p>

<br>

<input
    type="text"
    [(ngModel)]="searchTerm"
    placeholder="Search course">

<p>
    Searching for: {{ searchTerm }}
</p>
