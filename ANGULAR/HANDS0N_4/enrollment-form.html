<div class="form-container">
  <h2>Student Enrollment Request</h2>

  
  <div *ngIf="isSubmitted" class="success-message">
    Enrollment request submitted successfully!
  </div>

  
  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)" novalidate>

  
    <div class="form-group">
      <label for="studentName">Student Name *</label>
      <input 
        type="text" 
        id="studentName" 
        name="studentName" 
        ngModel 
        #nameCtrl="ngModel" 
        required 
        minlength="3" 
        class="form-control">
      
      
      <div *ngIf="nameCtrl.touched && nameCtrl.errors" class="error-pane">
        <small *ngIf="nameCtrl.errors['required']">Name is required.</small>
        <small *ngIf="nameCtrl.errors['minlength']">Name must be at least 3 characters.</small>
      </div>
    </div>

   
    <div class="form-group">
      <label for="studentEmail">Student Email *</label>
      <input 
        type="email" 
        id="studentEmail" 
        name="studentEmail" 
        ngModel 
        #emailCtrl="ngModel" 
        required 
        email 
        class="form-control">
      
      <div *ngIf="emailCtrl.touched && emailCtrl.errors" class="error-pane">
        <small *ngIf="emailCtrl.errors['required']">Email is required.</small>
        <small *ngIf="emailCtrl.errors['email']">Please enter a valid email address.</small>
      </div>
    </div>

   
    <div class="form-group">
      <label for="courseId">Course ID *</label>
      <input 
        type="number" 
        id="courseId" 
        name="courseId" 
        ngModel 
        #courseCtrl="ngModel" 
        required 
        class="form-control">
      
      <div *ngIf="courseCtrl.touched && courseCtrl.errors" class="error-pane">
        <small *ngIf="courseCtrl.errors['required']">Course ID is required.</small>
      </div>
    </div>

   
    <div class="form-group">
      <label for="preferredSemester">Preferred Semester</label>
      <select id="preferredSemester" name="preferredSemester" ngModel class="form-control">
        <option value="" disabled selected>Select a semester</option>
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>

 
    <div class="form-group checkbox-group">
      <label>
        <input 
          type="checkbox" 
          name="agreeToTerms" 
          ngModel 
          #termsCtrl="ngModel" 
          required> 
        I agree to the terms and conditions *
      </label>
      
      <div *ngIf="termsCtrl.touched && termsCtrl.errors" class="error-pane">
        <small *ngIf="termsCtrl.errors['required']">You must accept the terms before submitting.</small>
      </div>
    </div>

    <div class="button-row">
      <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
      <button type="button" class="btn-reset" (click)="onReset(enrollForm)">Reset</button>
    </div>

  </form>
</div>
